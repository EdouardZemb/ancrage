type: "exercices"
id: "q06kmxy0"
titre: "Grammatik"
statut: "source"
description: "Artikel, Plural und Partizip mit Küchenwörtern"
familles:
  - code: "artikel"
    libelle: "Artikel"
    options:
      - "der"
      - "die"
      - "das"
    regle: "Lern jedes Nomen mit seinem Artikel."
    exercices:
      - id: "z26ha1vh"
        invite: "___ Pfanne"
        reponse: "die"
      - id: "ww34mvq6"
        invite: "___ Kochtopf"
        reponse: "der"
      - id: "7fys5d2w"
        invite: "___ Sieb"
        reponse: "das"
      - id: "4mtyrw91"
        invite: "___ Schüssel"
        reponse: "die"
  - code: "plural"
    libelle: "Plural"
    exercices:
      - id: "2042nfjq"
        invite: "eine Pfanne, zwei ___"
        reponse: "Pfannen"
        regle: "Nomen auf -e: Plural mit -n."
      - id: "6d649k0d"
        invite: "ein Topf, zwei ___"
        reponse: "Töpfe"
        regle: "Umlaut und -e: Topf, Töpfe."
      - id: "mccpa19d"
        invite: "ein Teller, zwei ___"
        reponse: "Teller"
        regle: "Nomen auf -er bleiben im Plural oft gleich."
  - code: "partizip"
    libelle: "Partizip II"
    regle: "Das Partizip II bildet mit «haben» das Perfekt."
    exercices:
      - id: "j04a1q3f"
        invite: "backen → ich habe ___"
        reponse: "gebacken"
        options:
          - "gebacken"
          - "gebackt"
          - "backen"
      - id: "9r45zgnb"
        invite: "kochen → ich habe ___"
        reponse: "gekocht"
        options:
          - "gekocht"
          - "gekochen"
          - "kochte"
      - id: "v4xxqxet"
        invite: "schneiden → ich habe ___"
        reponse: "geschnitten"
        options:
          - "geschnitten"
          - "geschneidet"
          - "schnitt"
